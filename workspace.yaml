# workspace.yaml — the Dagster code location for this repo.
#
# Loaded by a bare `dagster dev` run from the repo root. `working_directory: .` is
# load-bearing: SwitchHandler, Logger and the *_RAW_DATA_DIR constants all use paths
# relative to the CWD (src/orchestration/_bootstrap.py enforces the same thing
# in-process, for safety when a module is loaded some other way).
#
# ⚠️ It is the REPO ROOT, not `src/`, even though the package lives under `src/` — the
# working directory is the CWD, and `src/` reaches `sys.path` through the prelude in
# definitions.py instead.
load_from:
  - python_file:
      relative_path: src/orchestration/definitions.py
      working_directory: .
