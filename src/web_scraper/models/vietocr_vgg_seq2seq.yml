# VietOCR `vgg_seq2seq` config — base.yml + vgg-seq2seq.yml, MERGED, so the recogniser needs
# no network. `Cfg.load_config_from_name` fetches both from vocr.vn on EVERY Predictor build
# and caches neither; when that host's certificate expired (2026-08-29, `VCR-1`) every
# `onnx@*` layer RAISED and the cascade fell through to tesseract with different figures.
# `Cfg.load_config_from_file` starts from an EMPTY dict, so this file has to carry both halves.
#
# Generated 2026-08-29 from the canonical upstream, over verified TLS:
#   https://raw.githubusercontent.com/pbcquoc/vietocr/master/config/base.yml
#       md5 af55db29e6587f52cfc1822611449bb2
#   https://raw.githubusercontent.com/pbcquoc/vietocr/master/config/vgg-seq2seq.yml
#       md5 b3e3014dea5f14a795b467fee38b8ded
# Cross-checked against the copy vendored in experiment_9 (hoaivannguyen/deepdoc_vietocr):
# base.yml parses IDENTICAL, and vgg-seq2seq.yml differs ONLY in `pretrain`/`weights` — the
# checkpoint's download URL, which `onnx_ocr` overwrites with the local .pth before use.
# Nothing that touches recognition (vocab, backbone, cnn, transformer, image sizes) differs.
#
# ⚠️ `device`, `weights` and `cnn.pretrained` are all overwritten by `onnx_ocr.VietOcrRecognizer`
# at construction; they are kept here because the file must be a COMPLETE vietocr config.
# ⚠️ EDIT NOTHING BY HAND. The whole point is that it is the config the parsed corpus was read
# with — verified by re-parsing VCB Q1-2026 and reproducing all 98 cells on disk.
aug:
  image_aug: true
  masked_language_model: true
backbone: vgg19_bn
cnn:
  hidden: 256
  ks:
  - - 2
    - 2
  - - 2
    - 2
  - - 2
    - 1
  - - 2
    - 1
  - - 1
    - 1
  ss:
  - - 2
    - 2
  - - 2
    - 2
  - - 2
    - 1
  - - 2
    - 1
  - - 1
    - 1
dataloader:
  num_workers: 3
  pin_memory: true
dataset:
  data_root: ./img/
  image_height: 32
  image_max_width: 512
  image_min_width: 32
  name: data
  train_annotation: annotation_train.txt
  valid_annotation: annotation_val_small.txt
device: cuda:0
optimizer:
  max_lr: 0.001
  pct_start: 0.1
predictor:
  beamsearch: false
pretrain: https://vocr.vn/data/vietocr/vgg_seq2seq.pth
quiet: false
seq_modeling: seq2seq
trainer:
  batch_size: 32
  checkpoint: ./checkpoint/transformerocr_checkpoint.pth
  export: ./weights/transformerocr.pth
  iters: 100000
  log: ./train.log
  metrics: null
  print_every: 200
  valid_every: 4000
transformer:
  decoder_embedded: 256
  decoder_hidden: 256
  dropout: 0.1
  encoder_hidden: 256
  img_channel: 256
vocab: 'aAàÀảẢãÃáÁạẠăĂằẰẳẲẵẴắẮặẶâÂầẦẩẨẫẪấẤậẬbBcCdDđĐeEèÈẻẺẽẼéÉẹẸêÊềỀểỂễỄếẾệỆfFgGhHiIìÌỉỈĩĨíÍịỊjJkKlLmMnNoOòÒỏỎõÕóÓọỌôÔồỒổỔỗỖốỐộỘơƠờỜởỞỡỠớỚợỢpPqQrRsStTuUùÙủỦũŨúÚụỤưƯừỪửỬữỮứỨựỰvVwWxXyYỳỲỷỶỹỸýÝỵỴzZ0123456789!"#$%&''()*+,-./:;<=>?@[\]^_`{|}~ '
weights: https://vocr.vn/data/vietocr/vgg_seq2seq.pth
