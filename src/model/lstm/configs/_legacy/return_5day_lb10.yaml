# LSTM run config (lookback 10). Dataset is REFERENCED by name under
# src/train_test_set/ (built by train_test_creator.ipynb from return_5day__lb10__final).

run_name: lstm__return_5day__lb10__final
dataset: vcb_return_5day_lb10_h5_final_tr70_val15_test15_std

model:
  type: LSTM
  hidden_size: 128
  num_layers: 2
  dropout: 0.2

train:
  batch_size: 64
  lr: 0.001
  weight_decay: 0.00001
  max_epochs: 150
  patience: 20
  grad_clip: 1.0
  lr_factor: 0.5
  lr_patience: 5
  log_every: 10

seed: 42
device: auto
